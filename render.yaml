services:
  - name: fluina-manim-renderer
    type: web
    runtime: docker
    plan: free
    rootDir: renderer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RENDER_TOKEN
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
